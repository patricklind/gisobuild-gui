name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint and audit tools
        run: python -m pip install ruff pip-audit graphifyy==0.9.61
      - name: Lint Python
        run: ruff check giso-webui/app.py giso-webui/cisco_download.py giso-webui/maintenance.py giso-webui/platform_validation.py giso-webui/tests staging scripts
      - name: Validate Graphify freshness and artifact exclusions
        run: python -B scripts/check_graphify_freshness.py
      - name: Audit Python dependencies
        run: pip-audit -r giso-webui/requirements.txt
      - name: Validate shell script
        run: bash -n build-giso.sh scripts/coord.sh scripts/worktree.sh
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Lint Dockerfiles
        run: |
          docker run --rm -i hadolint/hadolint:2.12.0 < giso-webui/Dockerfile
          docker run --rm -i hadolint/hadolint:2.12.0 < staging/Dockerfile
      - name: Validate Compose configuration
        working-directory: giso-webui
        run: docker compose config -q
      - name: Rehearse staged upgrade and rollback
        run: python -B staging/rehearse.py
      - name: Validate staging Compose configuration
        run: docker compose -f staging/compose.yaml config -q
      - name: Build production container
        working-directory: giso-webui
        run: docker compose build giso-webui
      - name: Run tests inside the built container
        run: |
          docker run --rm -v "$PWD:/project:ro" -w /project/giso-webui \
            giso-webui-giso-webui python -B -m unittest discover -s tests -v
