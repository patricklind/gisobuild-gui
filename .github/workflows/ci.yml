name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: giso-webui/requirements.txt
      - name: Install test tools
        run: python -m pip install -r giso-webui/requirements.txt ruff pip-audit
      - name: Lint Python
        run: ruff check giso-webui/app.py giso-webui/maintenance.py giso-webui/platform_validation.py giso-webui/tests staging scripts
      - name: Run tests
        working-directory: giso-webui
        run: python -B -m unittest discover -s tests -v
      - name: Audit Python dependencies
        run: pip-audit -r giso-webui/requirements.txt
      - name: Validate shell script
        run: bash -n build-giso.sh
      - name: Validate Compose configuration
        working-directory: giso-webui
        run: docker compose config -q
      - name: Rehearse staged upgrade and rollback
        run: python -B staging/rehearse.py
      - name: Validate staging Compose configuration
        run: docker compose -f staging/compose.yaml config -q
      - name: Build production container
        working-directory: giso-webui
        run: docker compose build giso-webui
