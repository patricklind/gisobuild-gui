name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned tooling image (Ruff, pip-audit, Graphify)
        run: docker build -f docker/tooling.Dockerfile -t gisobuild-tooling .
      - name: Lint Python
        run: |
          docker run --rm -v "$PWD:/project:ro" -w /project gisobuild-tooling \
            ruff check giso-webui/app.py giso-webui/cisco_download.py \
            giso-webui/maintenance.py giso-webui/platform_validation.py \
            giso-webui/tests giso-webui/browser_tests staging scripts --cache-dir=/tmp/ruff-cache
      - name: Check Python formatting
        run: |
          docker run --rm -v "$PWD:/project:ro" -w /project gisobuild-tooling \
            ruff format --check giso-webui/app.py giso-webui/cisco_download.py \
            giso-webui/maintenance.py giso-webui/platform_validation.py \
            giso-webui/tests giso-webui/browser_tests staging scripts --cache-dir=/tmp/ruff-cache
      - name: Lint JavaScript
        run: |
          docker run --rm -v "$PWD/giso-webui/static:/work:ro" -w /work \
            node@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0 \
            sh -c "npx --yes eslint@8.57.0 app.js manual-packages.js"
      - name: Check docs and scripts for host-side project tooling
        run: |
          docker run --rm -v "$PWD:/project:ro" -w /project gisobuild-tooling \
            python -B scripts/check_docker_only.py
      - name: Validate Graphify freshness and artifact exclusions
        run: |
          docker run --rm -v "$PWD:/project" -w /project gisobuild-tooling \
            python -B scripts/check_graphify_freshness.py --graphify graphify
      - name: Audit Python dependencies
        run: |
          docker run --rm -v "$PWD:/project:ro" -w /project gisobuild-tooling \
            pip-audit -r giso-webui/requirements.txt
      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            zricethezav/gitleaks:v8.30.1 detect --source . --no-git -v
      - name: Validate shell script
        run: bash -n build-giso.sh scripts/coord.sh scripts/worktree.sh
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Lint Dockerfiles
        run: |
          docker run --rm -i hadolint/hadolint:2.12.0 < giso-webui/Dockerfile
          docker run --rm -i hadolint/hadolint:2.12.0 < staging/Dockerfile
          docker run --rm -i hadolint/hadolint:2.12.0 < docker/tooling.Dockerfile
          docker run --rm -i hadolint/hadolint:2.12.0 < docker/selfcontained.Dockerfile
      - name: Validate Compose configuration (default and socket deployments)
        working-directory: giso-webui
        run: |
          docker compose config -q
          docker compose -f compose.socket.yaml config -q
      - name: Rehearse staged upgrade and rollback
        run: |
          docker run --rm -v "$PWD:/project:ro" -w /project/staging gisobuild-tooling \
            python -B rehearse.py
      - name: Validate staging Compose configuration
        run: docker compose -f staging/compose.yaml config -q
      - name: Build the socket-deployment web image (also the unit-test image)
        working-directory: giso-webui
        run: |
          SOURCE_REVISION="$GITHUB_SHA" BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            docker compose -f compose.socket.yaml build giso-webui
      - name: Run tests inside the built container
        run: |
          docker run --rm -v "$PWD:/project:ro" -w /project/giso-webui \
            giso-webui-giso-webui python -B -m unittest discover -s tests -v
      - name: Run browser tests (Playwright/Chromium in Docker)
        run: |
          docker build -f docker/browser-tests.Dockerfile -t gisobuild-browser-tests .
          docker run --rm -v "$PWD:/work:ro" -e PYTHONDONTWRITEBYTECODE=1 \
            gisobuild-browser-tests python3 -m unittest discover -s browser_tests -v
      - name: Scan socket-deployment image for fixable HIGH/CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image --quiet --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            giso-webui-giso-webui:latest
      - name: Generate SBOM for the production image
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/sbom:/out" anchore/syft:v1.33.0 giso-webui-giso-webui:latest \
            -o spdx-json=/out/giso-webui.spdx.json -q
      - name: Build the default image through compose.yaml (bundled gisobuild, no Docker socket)
        working-directory: giso-webui
        run: |
          SOURCE_REVISION="$GITHUB_SHA" BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            docker compose build giso-webui
          docker run --rm giso-webui-selfcontained \
            python3 /opt/gisobuild/src/gisobuild.py --help > /dev/null
      - name: Check platform support against the bundled upstream gisobuild
        run: |
          docker run --rm -v "$PWD:/project:ro" -w /project/giso-webui \
            -e REQUIRE_UPSTREAM_GISOBUILD=1 -e PYTHONDONTWRITEBYTECODE=1 giso-webui-selfcontained \
            python3.12 -m unittest discover -s tests -p test_platform_compatibility.py -v
      - name: Scan default image for fixable HIGH/CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image --quiet --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            giso-webui-selfcontained:latest
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: giso-webui-sbom
          path: sbom/giso-webui.spdx.json
