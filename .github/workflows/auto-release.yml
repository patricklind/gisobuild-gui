name: Auto-tag release

# Every push to main that passes CI is automatically released, at most once
# per hour: this workflow only computes the next version and pushes that tag.
# Patch and minor each roll over at 9 into the next component (v0.0.9 ->
# v0.1.0, v0.9.9 -> v1.0.0), not an unbounded patch counter. It never builds
# or publishes anything itself - pushing a "v*" tag is release.yml's own,
# pre-existing trigger (docs/releasing.md), which re-runs the full CI suite
# against that exact commit and only builds/publishes if that passes too, the
# same gate a manual `workflow_dispatch` release already goes through. This
# workflow adds no new publishing path, only removes the manual "Run
# workflow" step for an ordinary release.
#
# A deliberate out-of-sequence bump or a pre-release still uses the existing
# manual `workflow_dispatch` trigger on release.yml; do that before the next
# push to main advances the auto version past it, or afterwards.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-tag-release
  cancel-in-progress: false

env:
  # Confirmed with the maintainer: at least this long between automatic
  # releases, so several commits landing close together do not each get
  # their own release - the next push after the gap reopens still releases
  # everything accumulated since the last tag, just as one release instead
  # of several.
  MIN_SECONDS_BETWEEN_RELEASES: 3600

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Check the minimum interval since the last release
        id: interval
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          if [[ -z "$latest" ]]; then
            echo "No existing release tag; proceeding."
            echo "ok=true" >>"$GITHUB_OUTPUT"
          else
            # The tag's own creation time, not the commit it points at - a
            # tag can be pushed for an older commit (as this workflow does),
            # so the commit's own timestamp would not reflect when the last
            # release actually happened.
            last_epoch=$(git for-each-ref "refs/tags/$latest" --format='%(creatordate:unix)')
            elapsed=$(( $(date +%s) - last_epoch ))
            if ((elapsed < MIN_SECONDS_BETWEEN_RELEASES)); then
              echo "$elapsed s since $latest (minimum ${MIN_SECONDS_BETWEEN_RELEASES}s) - skipping this release; the next push after the interval passes will release everything accumulated since $latest."
              echo "ok=false" >>"$GITHUB_OUTPUT"
            else
              echo "$elapsed s since $latest (minimum ${MIN_SECONDS_BETWEEN_RELEASES}s) - proceeding."
              echo "ok=true" >>"$GITHUB_OUTPUT"
            fi
          fi
      - name: Compute the next version
        if: steps.interval.outputs.ok == 'true'
        id: version
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          if [[ -z "$latest" ]]; then
            next="v0.0.1"
          else
            IFS='.' read -r major minor patch <<<"${latest#v}"
            # Odometer rollover, not an unbounded patch counter: patch and
            # minor each wrap at 9, carrying into the next component -
            # v0.0.9 -> v0.1.0, v0.9.9 -> v1.0.0 (confirmed with the
            # maintainer).
            patch=$((patch + 1))
            if ((patch > 9)); then
              patch=0
              minor=$((minor + 1))
              if ((minor > 9)); then
                minor=0
                major=$((major + 1))
              fi
            fi
            next="v${major}.${minor}.${patch}"
          fi
          echo "Latest release: ${latest:-none}; next: $next"
          echo "tag=$next" >>"$GITHUB_OUTPUT"
      - name: Create and push the release tag
        if: steps.interval.outputs.ok == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "GISO Builder $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
