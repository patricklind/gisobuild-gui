name: Auto-tag release

# Every push to main that passes CI is automatically released, at most once
# per hour: this workflow only computes the next version and asks
# release.yml to do the rest. Patch and minor each roll over at 9 into the
# next component (v0.0.9 -> v0.1.0, v0.9.9 -> v1.0.0), not an unbounded patch
# counter.
#
# Fixed 2026-09-19 (found by inspecting real GitHub Actions/GHCR state, not
# assumed): this workflow originally pushed the tag itself with
# `git push origin refs/tags/$RELEASE_TAG`, using the default GITHUB_TOKEN.
# GitHub explicitly documents that events triggered by GITHUB_TOKEN do not
# trigger other workflow runs (to avoid infinite loops) - so that tag push
# never fired release.yml's `on: push: tags: ["v*"]` trigger. The tag object
# was created on GitHub (confirmed: v0.1.1/v0.1.2 exist as real tags), but
# nothing ever built or published anything for it, and no GitHub Release was
# created automatically - v0.1.1's release existed only because a human
# manually created it afterward. Earlier tags (through v0.1.0) worked because
# they were pushed by a human, not by this workflow.
#
# Fix: explicitly dispatch release.yml's own, already-proven-working
# `workflow_dispatch` trigger (confirmed working end-to-end for v0.1.0:
# validate, the full reused CI suite, and both image builds all succeeded)
# instead of pushing a tag ourselves. `gh workflow run` is a direct,
# intentional API call, not an automatically-cascaded git event, so it is not
# subject to the same GITHUB_TOKEN restriction. release.yml's own
# `create-tag` job then creates the tag exactly as it already does for a
# manual release, and its own `validate` job's "does this tag already exist"
# check protects against ever double-tagging.
#
# This workflow still adds no new publishing path and duplicates no publish
# logic - it only replaces the manual "Run workflow" click for an ordinary
# release with an automatic decision of when and what version to run it with.
#
# A deliberate out-of-sequence bump or a pre-release still uses the existing
# manual `workflow_dispatch` trigger on release.yml directly; do that before
# the next push to main advances the auto version past it, or afterwards.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: auto-tag-release
  cancel-in-progress: false

env:
  # Confirmed with the maintainer: at least this long between automatic
  # releases, so several commits landing close together do not each get
  # their own release - the next push after the gap reopens still releases
  # everything accumulated since the last tag, just as one release instead
  # of several.
  MIN_SECONDS_BETWEEN_RELEASES: 3600

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Check the minimum interval since the last release
        id: interval
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          if [[ -z "$latest" ]]; then
            echo "No existing release tag; proceeding."
            echo "ok=true" >>"$GITHUB_OUTPUT"
          else
            # The tag's own creation time, not the commit it points at - a
            # tag can be pushed for an older commit (as release.yml's
            # create-tag job does), so the commit's own timestamp would not
            # reflect when the last release actually happened.
            last_epoch=$(git for-each-ref "refs/tags/$latest" --format='%(creatordate:unix)')
            elapsed=$(( $(date +%s) - last_epoch ))
            if ((elapsed < MIN_SECONDS_BETWEEN_RELEASES)); then
              echo "$elapsed s since $latest (minimum ${MIN_SECONDS_BETWEEN_RELEASES}s) - skipping this release; the next push after the interval passes will release everything accumulated since $latest."
              echo "ok=false" >>"$GITHUB_OUTPUT"
            else
              echo "$elapsed s since $latest (minimum ${MIN_SECONDS_BETWEEN_RELEASES}s) - proceeding."
              echo "ok=true" >>"$GITHUB_OUTPUT"
            fi
          fi
      - name: Compute the next version
        if: steps.interval.outputs.ok == 'true'
        id: version
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          if [[ -z "$latest" ]]; then
            next="v0.0.1"
          else
            IFS='.' read -r major minor patch <<<"${latest#v}"
            # Odometer rollover, not an unbounded patch counter: patch and
            # minor each wrap at 9, carrying into the next component -
            # v0.0.9 -> v0.1.0, v0.9.9 -> v1.0.0 (confirmed with the
            # maintainer).
            patch=$((patch + 1))
            if ((patch > 9)); then
              patch=0
              minor=$((minor + 1))
              if ((minor > 9)); then
                minor=0
                major=$((major + 1))
              fi
            fi
            next="v${major}.${minor}.${patch}"
          fi
          echo "Latest release: ${latest:-none}; next: $next"
          echo "tag=$next" >>"$GITHUB_OUTPUT"
      - name: Dispatch the Release workflow for the computed version
        if: steps.interval.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f version="$RELEASE_TAG" -f prerelease=false
