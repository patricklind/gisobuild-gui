name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (for example v1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Publish as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release request
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$SELECTED_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from the main branch, not $SELECTED_REF" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must use semantic version format, for example v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] && \
             git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists" >&2
            exit 1
          fi

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  create-tag:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create annotated tag
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "GISO Builder $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

  image-and-release:
    needs: [verify, create-tag]
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
      - name: Select release tag
        env:
          MANUAL_TAG: ${{ inputs.version }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "RELEASE_TAG=$MANUAL_TAG" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=$PUSHED_TAG" >> "$GITHUB_ENV"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Socket deployment web image (compose.socket.yaml).
      - uses: docker/build-push-action@v6
        with:
          context: giso-webui
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}-socket
            ghcr.io/${{ github.repository }}:latest-socket
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            APP_VERSION=${{ env.RELEASE_TAG }}
          provenance: mode=max
          sbom: true
      # Default image (compose.yaml): web app plus pinned gisobuild.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/selfcontained.Dockerfile
          push: true
          # gisobuild and Cisco IOS XR images are x86_64-only.
          platforms: linux/amd64
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            APP_VERSION=${{ env.RELEASE_TAG }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
            ghcr.io/${{ github.repository }}:latest
          provenance: mode=max
          sbom: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(release create "$RELEASE_TAG" --verify-tag --generate-notes --title "GISO Builder $RELEASE_TAG")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
