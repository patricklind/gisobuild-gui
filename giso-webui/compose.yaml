# Default deployment: one image holds the web app and a pinned
# ios-xr/gisobuild (docker/selfcontained.Dockerfile, gisobuild verified by
# commit and SHA-256 manifest). It mounts no Docker socket and no host
# gisobuild checkout, and never starts a second container or pulls a builder
# image. The older socket-based deployment is compose.socket.yaml.
#
#   cd giso-webui && docker compose up -d --build
#
# That builds the image here. To run a published image instead, set
# GISO_WEBUI_IMAGE in .env (for example
# ghcr.io/patricklind/gisobuild-gui:v1.2.3) and use docker compose pull:
# a plain "docker compose pull" cannot fetch the local build name below.
services:
  giso-webui:
    build:
      context: ..
      dockerfile: docker/selfcontained.Dockerfile
      args:
        SOURCE_REVISION: "${SOURCE_REVISION:-unknown}"
        BUILD_DATE: "${BUILD_DATE:-unknown}"
        APP_VERSION: "${APP_VERSION:-0.0.1}"
    image: ${GISO_WEBUI_IMAGE:-giso-webui-selfcontained}
    # gisobuild and Cisco IOS XR images are x86_64.
    platform: linux/amd64
    container_name: giso-webui
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - giso-uploads:/uploads
      - "${CISCO_SECRETS_DIR:-./secrets}:/run/secrets:ro"
      - giso-output:/output
      - giso-archive:/archive
      - giso-work:/work
      - giso-state:/state
    environment:
      DATA_ROOT: /uploads
      OUTPUT_ROOT: /output
      WORK_ROOT: /work
      ARCHIVE_ROOT: /archive
      STATE_ROOT: /state
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-8589934592}"
      MAX_EXTRACTED_BYTES: "${MAX_EXTRACTED_BYTES:-17179869184}"
      MAX_TAR_MEMBERS: "${MAX_TAR_MEMBERS:-10000}"
      MAX_CHUNK_BYTES: "${MAX_CHUNK_BYTES:-16777216}"
      MAX_LOG_BYTES: "${MAX_LOG_BYTES:-10485760}"
      MAX_JOB_HISTORY: "${MAX_JOB_HISTORY:-100}"
      ARCHIVE_RETENTION_DAYS: "${ARCHIVE_RETENTION_DAYS:-30}"
      MAX_ARCHIVE_BYTES: "${MAX_ARCHIVE_BYTES:-53687091200}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      UPLOAD_SESSION_TTL: "${UPLOAD_SESSION_TTL:-86400}"
      CISCO_CLIENT_ID: "${CISCO_CLIENT_ID:-}"
      CISCO_CLIENT_SECRET: "${CISCO_CLIENT_SECRET:-}"
      CISCO_CLIENT_ID_FILE: "${CISCO_CLIENT_ID_FILE:-}"
      CISCO_CLIENT_SECRET_FILE: "${CISCO_CLIENT_SECRET_FILE:-}"
      CISCO_DOWNLOAD_TIMEOUT_SECONDS: "${CISCO_DOWNLOAD_TIMEOUT_SECONDS:-60}"
      CISCO_DOWNLOAD_HOSTS: "${CISCO_DOWNLOAD_HOSTS:-cisco.com}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-127.0.0.1,localhost,giso-webui}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The only capability gisobuild needs: its eXR engine chroots into the
    # extracted image to query RPMs. Verified with a real NCS5500 build.
    cap_add:
      - SYS_CHROOT
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped

  archive-maintenance:
    image: ${GISO_WEBUI_IMAGE:-giso-webui-selfcontained}
    platform: linux/amd64
    container_name: giso-archive-maintenance
    depends_on:
      - giso-webui
    command: ["python3.12", "maintenance.py"]
    volumes:
      - giso-archive:/archive
    environment:
      ARCHIVE_ROOT: /archive
      ARCHIVE_RETENTION_DAYS: "${ARCHIVE_RETENTION_DAYS:-30}"
      MAX_ARCHIVE_BYTES: "${MAX_ARCHIVE_BYTES:-53687091200}"
      ARCHIVE_CLEANUP_INTERVAL_SECONDS: "${ARCHIVE_CLEANUP_INTERVAL_SECONDS:-3600}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  giso-work:
  giso-uploads:
  giso-output:
  giso-archive:
  giso-state:
